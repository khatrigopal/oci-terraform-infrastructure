version: 0.1
component: build

shell: bash

steps:

  - type: Command
    name: Terraform Version
    command: |
      terraform version

  - type: Command
    name: Terraform Init
    command: |
      cd terraform
      terraform init

  - type: Command
    name: Terraform Validate
    command: |
      cd terraform
      terraform validate

  - type: Command
    name: Terraform Plan
    command: |
      cd terraform
      terraform plan

  - type: Command
    name: Terraform Apply
    command: |
      cd terraform
      terraform apply -auto-approve