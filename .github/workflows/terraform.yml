name: OCI Terraform Pipeline

on:
  workflow_dispatch:

jobs:
  terraform:
    name: OCI Terraform Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    env:
      # Terraform Provider Variables
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}

      # OCI Backend Authentication
      OCI_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_user_ocid: ${{ secrets.OCI_USER_OCID }}
      OCI_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      OCI_private_key_path: /home/runner/.oci/oci_api_key.pem
      OCI_region: ${{ secrets.OCI_REGION }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure OCI API Key
        run: |
          mkdir -p /home/runner/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
