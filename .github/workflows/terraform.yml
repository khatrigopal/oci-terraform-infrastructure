name: OCI Terraform Pipeline

on:
  workflow_dispatch:

jobs:
  terraform:
    name: OCI Terraform Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /home/runner/.oci/oci_api_key.pem
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure OCI Private Key
        run: |
          mkdir -p /home/runner/.oci
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}" \
            -backend-config="user_ocid=${{ secrets.OCI_USER_OCID }}" \
            -backend-config="fingerprint=${{ secrets.OCI_FINGERPRINT }}" \
            -backend-config="private_key_path=/home/runner/.oci/oci_api_key.pem" \
            -backend-config="region=${{ secrets.OCI_REGION }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
